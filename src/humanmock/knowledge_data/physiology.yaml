  k_innate_off:       {value: 0.06,    iiv: 0.20, source: assumption, note: "innate decay, half-life about 12 h"}
  k_effector_on:      {value: 0.006,   iiv: 0.35, source: assumption, note: "adaptive effector activation"}
  k_effector_off:     {value: 0.003,   iiv: 0.20, source: assumption, note: "effector decay, half-life about 10 days"}
  memory_boost:       {value: 6.0,     iiv: 0.30, source: assumption, note: "how much immune memory speeds re-activation"}
  memory_direct_kill: {value: 0.3,     iiv: 0.30, source: assumption, note: "standing protection from memory"}
  k_memory_on:        {value: 0.008,   iiv: 0.30, source: assumption, note: "memory formation while effectors are active"}
  k_memory_off:       {value: 0.000079, iiv: 0.20, source: assumption, note: "memory decay, half-life about 1 year"}
  k_cytokine:         {value: 0.3,     iiv: 0.15, source: assumption, note: "cytokine turnover, half-life about 2.3 h"}
  tissue_to_cytokine: {value: 0.2,     iiv: 0.25, source: assumption, note: "damaged tissue keeps inflammation going"}
  k_crp_prod:         {value: 3.0,     iiv: 0.35, source: assumption, note: "CRP production in mg/L per hour at full cytokine"}
  k_crp_off:          {value: 0.0365,  iiv: 0.10, source: "CRP half-life about 19 h, textbook value not re-verified", note: "CRP clearance"}
  k_wbc_prod:         {value: 0.25,    iiv: 0.30, source: assumption, note: "white cell rise"}
  k_wbc_off:          {value: 0.05,    iiv: 0.20, source: assumption, note: "white cell return to baseline"}
  k_heal:             {value: 0.022,   iiv: 0.30, source: assumption, note: "throat tissue healing"}
  k_cough:            {value: 0.05,    iiv: 0.25, source: assumption, note: "cough drive turnover"}
  k_fatigue:          {value: 0.04,    iiv: 0.25, source: assumption, note: "fatigue turnover"}
  fever_max:          {value: 2.8,     iiv: 0.15, source: assumption, note: "largest pyrogenic rise in degrees C"}
  fever_half:         {value: 0.4,     iiv: 0.20, source: assumption, note: "cytokine level giving half the fever"}
  tau_temp:           {value: 1.0,     iiv: 0.15, source: assumption, note: "time for body temperature to follow its set point"}
  hr_per_c:           {value: 9.0,     iiv: 0.15, source: "about 8 to 10 bpm per degree C, textbook value not re-verified", note: "heart rate rise with temperature"}
  hr_per_cytokine:    {value: 6.0,     iiv: 0.25, source: assumption, note: "sympathetic heart rate rise"}
  rr_per_c:           {value: 1.5,     iiv: 0.20, source: assumption, note: "breathing rate rise with temperature"}
  rr_per_cytokine:    {value: 1.5,     iiv: 0.25, source: assumption, note: "breathing rate rise with inflammation"}
  pain_tissue:        {value: 2.2,     iiv: 0.25, source: assumption, note: "throat pain from tissue damage"}
  pain_cytokine:      {value: 0.4,     iiv: 0.25, source: assumption, note: "throat pain from inflammation"}
  fatigue_gain:       {value: 2.0,     iiv: 0.25, source: assumption, note: "fatigue score gain"}
  k_gut_recover:      {value: 0.008,   iiv: 0.30, source: assumption, note: "gut flora recovery, half-life about 3.6 days"}
  k_tox_recover:      {value: 0.01,    iiv: 0.30, source: assumption, note: "organ stress recovery"}
  tox_clearance_loss: {value: 0.7,     iiv: 0.20, source: assumption, note: "organ stress reduces drug clearance"}

