# Every value here is the STARTING POINT for training, not a measured truth.
# "source: assumption" means nobody has calibrated it yet. Replacing an
# assumption with a cited value is one of the most useful contributions.
# Units are hours, litres, milligrams. "iiv" is the between-person spread as a
# log-normal standard deviation.

# What can describe a person. Callers may give any of these, and anything missing
# is sampled from similar people. Center and scale only put values on a similar
# footing for the networks. Min and max reject impossible values. A parameter that
# population_nhanes.json does not cover needs a prior, either [normal, mean, sd] or
# [lognormal, log mean, log sd], and a source for that prior.
patient:
  age_years:            {center: 45,   scale: 20,  min: 12,   max: 90,  note: "Age in years"}
  sex_female:           {center: 0.5,  scale: 0.5, note: "1 for female and 0 for male. Callers send sex as text."}
  weight_kg:            {center: 75,   scale: 20,  min: 25,   max: 250, note: "Body weight in kg"}
  height_cm:            {center: 168,  scale: 12,  min: 120,  max: 220, note: "Height in cm"}
  creatinine_mg_dl:     {center: 0.9,  scale: 0.3, min: 0.2,  max: 12,  note: "Blood creatinine in mg/dL, a kidney test"}
  alt_u_l:              {center: 22,   scale: 15,  min: 3,    max: 400, note: "ALT in U/L, a liver test"}
  heart_rate_bpm:       {center: 72,   scale: 12,  min: 40,   max: 130, note: "Resting heart rate per minute"}
  respiratory_rate_bpm: {center: 15,   scale: 3,   min: 8,    max: 30,  note: "Resting breaths per minute", prior: [normal, 15.0, 2.0], source: assumption}
  wbc_k_ul:             {center: 7,    scale: 2.5, min: 1.5,  max: 25,  note: "White cells, thousand per microlitre"}
  crp_mg_l:             {center: 2,    scale: 5,   min: 0.05, max: 60,  note: "C-reactive protein in mg/L"}
  body_temp_c:          {center: 36.7, scale: 0.4, min: 35.5, max: 37.8, note: "Temperature when healthy, in degrees C", prior: [normal, 36.7, 0.25], source: assumption}
  systolic_bp_mmhg:     {center: 120,  scale: 18,  min: 70,   max: 220, note: "Blood pressure, upper number"}
  diastolic_bp_mmhg:    {center: 72,   scale: 12,  min: 30,   max: 130, note: "Blood pressure, lower number"}
  immune_function:      {center: 1,    scale: 0.3, min: 0.05, max: 2,   note: "Immune strength, where 1 is typical", prior: [lognormal, 0.0, 0.2], source: assumption}
  hepatic_function:     {center: 1,    scale: 0.3, min: 0.05, max: 1.5, note: "Liver clearance, where 1 is typical", prior: [lognormal, 0.0, 0.1], source: assumption}

system:
