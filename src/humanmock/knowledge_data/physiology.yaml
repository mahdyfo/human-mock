# Drug fields map one to one to DRUG_FIELDS in humanmock/knowledge.py, so a
# hypothetical drug can be described by mechanism instead of by name.
# Oral values fitted with bioavailability 1.0 are apparent values, so IV use of
# those drugs is not valid.
drugs:
  amoxicillin:
    label: "Amoxicillin"
    ka: 1.2
    bioavailability: 1.0
    v_l_per_kg: 0.52
    cl_ref_l_h: 24.7
    frac_renal: 0.6
    frac_unbound: 0.8
    kill_emax: 1.6
    kill_ec50: 0.016
    kill_hill: 2.0
    reservoir_penetration: 0.02
    gut_rate: 0.002
    gut_ec50: 1.0
    tox_rate: 0.02
    tox_ec50: 300.0
    max_single_dose_mg: 1000
    max_daily_dose_mg: 3000
    sources:
      pk: "DailyMed amoxicillin label: half-life 61.3 min, 875 mg Cmax 13.8 and AUC 35.4, so apparent CL/F 24.7 L/h and V/F 36.4 L"
      binding: "DailyMed amoxicillin label: about 20% protein bound"
      renal: "DailyMed amoxicillin label: about 60% in urine within 6 to 8 h"
      kill_ec50: "EUCAST S. pyogenes panel includes 0.016 mg/L for benzylpenicillin, amoxicillin value is an assumption"
      kill_emax: assumption
      reservoir_penetration: "poor epithelial penetration is described in reviews, the number is an assumption"
      dose_limits: "warning thresholds only, not clinical guidance"
  penicillin_v:
    label: "Penicillin V"
    ka: 2.5
    bioavailability: 0.6
    v_l_per_kg: 0.57
    cl_ref_l_h: 41.0
    frac_renal: 0.4
    frac_unbound: 0.23
    kill_emax: 1.6
    kill_ec50: 0.016
    kill_hill: 2.0
    reservoir_penetration: 0.02
    gut_rate: 0.0015
    gut_ec50: 1.0
    tox_rate: 0.02
    tox_ec50: 300.0
    max_single_dose_mg: 1000
    max_daily_dose_mg: 4000
    sources:
      pk: "500 mg oral peak 3 to 5 mg/L at 30 to 60 min, serum half-life 41 min, bioavailability about 60%"
      binding: "unbound fraction 23% in a healthy adult study"
      kill_emax: assumption
      dose_limits: "warning thresholds only, not clinical guidance"
  ibuprofen:
    label: "Ibuprofen"
    ka: 2.5
    bioavailability: 1.0
    v_l_per_kg: 0.12
    cl_ref_l_h: 2.6
    frac_renal: 0.01
    frac_unbound: 0.01
    antipyretic_emax: 0.85
    antipyretic_ec50: 8.0
    analgesic_emax: 0.7
    analgesic_ec50: 8.0
    tox_rate: 0.03
    tox_ec50: 250.0
    max_single_dose_mg: 800
    max_daily_dose_mg: 3200
    sources:
      pk: "Ibuprofen label: half-life about 2 h, CL/F about 2.6 L/h, volume about 0.12 L/kg"
      effects: assumption
      dose_limits: "warning thresholds only, not clinical guidance"
  paracetamol:
    label: "Paracetamol (acetaminophen)"
    ka: 2.5
    bioavailability: 0.745
    v_l_per_kg: 0.9
    cl_ref_l_h: 21.0
    frac_renal: 0.05
    frac_unbound: 0.8
    antipyretic_emax: 0.75
    antipyretic_ec50: 5.0
    analgesic_emax: 0.6
    analgesic_ec50: 5.0
    tox_rate: 0.3
    tox_ec50: 150.0
    max_single_dose_mg: 1000
    max_daily_dose_mg: 4000
    sources:
      pk: "Review: volume about 0.9 L/kg, half-life 1.9 to 2.5 h, clearance 4.5 to 5.5 mL/kg/min. Pooled adult study: 74.5% absorbed"
      effects: assumption
      tox_ec50: assumption
      dose_limits: "warning thresholds only, not clinical guidance"
