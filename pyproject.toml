[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "humanmock"
version = "0.1.0"
description = "Open, trainable simulator of human body behaviour: mechanistic organs plus neural corrections, served through a session API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "jax>=0.4.30",
  "equinox>=0.11",
  "diffrax>=0.6",
  "optax>=0.2",
  "numpy>=1.26",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/mahdyfo/human-mock"
Issues = "https://github.com/mahdyfo/human-mock/issues"

[project.scripts]
humanmock = "humanmock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"humanmock.knowledge_data" = ["*.yaml", "*.json"]
"humanmock" = ["ui/*", "ui/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a model for real, takes minutes"]
addopts = "-q"
